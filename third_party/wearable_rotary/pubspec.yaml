name: wearable_rotary
description: >-
  OpenHarmony (HarmonyOS NEXT) implementation of the wearable_rotary API. The
  upstream package (Samsung wearable_rotary 2.0.4) ships Android/Tizen platform
  implementations only; no ohos fork exists yet. This package keeps the exact
  Dart API surface used by XianYu-Music-Watch (RotaryEvent / RotaryDirection /
  rotaryEvents) and consumes the project-owned `xianyu/rotary` EventChannel
  (EntryAbility.ets registration + Index.ets onDigitalCrown forwarding, API
  18+), so crown input works on ohos without per-call-site changes. Active
  ONLY in ohos dependency state (pubspec_overrides.yaml written by
  scripts/ohos/pub-state.ps1); Android keeps the official package.
version: 2.0.4
publish_to: 'none'

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
