org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Gradle 9.1.0 不支持 Java 25（系统默认 JDK 会选 jdk-25 导致 Kotlin daemon 崩溃），
# 必须使用 JDK 21。机器相关的 JDK 路径不写在这里（避免不同开发机盘符/路径冲突），
# 请各自在用户级 ~/.gradle/gradle.properties 配置，例如：
#   org.gradle.java.home=D:\\Program Files\\Java\\jdk-21.0.10
# 或设置 JAVA_HOME 指向本机 JDK 21。
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 项目路径含空格等，禁用 Android Gradle 插件路径检查 (b.android.com/95744)
android.overridePathCheck=true
# Kotlin daemon 在本机环境（JDK25/临时目录）下崩溃，改用进程内编译
#（与手机端 XianYu-Music-Mobile 同款配置）
kotlin.compiler.execution.strategy=in-process
# 禁用 Kotlin 增量编译，规避增量缓存文件写入失败（Could not close incremental caches）
kotlin.incremental=false
# 禁用插件默认 ABI 注入（FlutterPlugin.kt configureAbiWithoutSplits 会 clear 掉
# build.gradle.kts 里的 abiFilters 再写入全部三个 ABI；设为 true 后自定义 arm64-only 生效）
disable-abi-filtering=true
