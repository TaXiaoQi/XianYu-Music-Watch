[target.aarch64-linux-android]
linker = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
ar = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"

[env]
# Let cc build-scripts (e.g. ring, image codecs) locate the NDK clang via ASCII junction.
CC_aarch64_linux_android = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/aarch64-linux-android24-clang.cmd"
AR_aarch64_linux_android = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
CC_armv7_linux_androideabi = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/armv7a-linux-androideabi24-clang.cmd"
CC_x86_64_linux_android = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/x86_64-linux-android24-clang.cmd"
CC_i686_linux_android = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/i686-linux-android24-clang.cmd"
AR_armv7_linux_androideabi = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
AR_x86_64_linux_android = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"
AR_i686_linux_android = "C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/bin/llvm-ar.exe"

# bindgen 类构建脚本（rquickjs-sys）需要 NDK sysroot 头文件：cargo-ndk 会自动注入，
# 裸 cargo --target 构建靠这里兜底（junction 保证路径纯 ASCII）。
BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "--target=aarch64-linux-android --sysroot=C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/include"
BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi = "--target=armv7-linux-androideabi --sysroot=C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/include"
BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android = "--target=x86_64-linux-android --sysroot=C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/include"
BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android = "--target=i686-linux-android --sysroot=C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/sysroot -isystem C:/AndroidSdk/ndk/27.1.12297006/toolchains/llvm/prebuilt/windows-x86_64/lib/clang/18/include"

