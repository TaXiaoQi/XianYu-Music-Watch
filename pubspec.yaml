name: xianyu_watch
description: "弦予音乐腕上版（Wear OS）：连接手机时为延伸控制器，独立时支持本地/在线播放。"
publish_to: 'none'

version: 1.0.1+1000100

environment:
  # 下限放宽到 3.11：Flutter-OH 3.41.10-ohos 对应 Dart 3.11（鸿蒙构建用），
  # 官方 Flutter（Android）用 Dart 3.12+/3.13 仍满足（与移动端同款写法）
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（与移动端同栈）
  flutter_riverpod: ^2.6.1
  # 手表表冠旋转输入：本地双平台实现（Android 原生转发 + 鸿蒙
  # onDigitalCrown 桥接，同一 "xianyu/rotary" EventChannel），
  # 与 pubspec.lock 保持一致，避免 pub 重解析回 pub.dev 版导致平台断链。
  wearable_rotary:
    path: third_party/wearable_rotary
  # 已配对手机地址持久化
  shared_preferences: ^2.3.3
  # Rust core（扫描/入库/元数据解析，与移动端同源 libxianyu_core.so）
  flutter_rust_bridge: 2.12.0
  # 本地播放
  just_audio: ^0.9.0
  # 音频焦点/打断监听（被其他应用占用输出时暂停；ohos 走 overrides 钉的 fork）
  audio_session: ^0.1.25
  # 后台播放保障：系统 MediaSession + 前台媒体服务（灭屏/切走不被杀）
  audio_service: ^0.18.18
  # 数据目录/路径
  path_provider: ^2.1.0
  path: ^1.9.0
  # 插件脚本 SHA-256 指纹（与移动端同栈）
  crypto: ^3.0.3
  # 插件同步：用户变量 AES-256-CBC 加密（对齐桌面/移动协议）
  encrypt: ^5.0.3
  # 网盘引擎：天翼 RSA-PKCS1 登录加密（与移动端同款，encrypt 传递依赖）
  pointycastle: ^3.9.1
  # 敏感凭据安全存储（Android Keystore / iOS Keychain）：
  # 登录 token 加密密钥。鸿蒙由下方 vendored 插件提供真安全存储（HUKS），
  # 插件缺失时 SecureStore 回退 SharedPreferences
  flutter_secure_storage: ^11.2.0
  # 鸿蒙原生实现（仅声明 ohos 平台，Android/iOS 构建零参与）：
  # vendor 自 SIG fluttertpc fork 并剥离 Dart 层，官方主包经同名
  # MethodChannel 直连原生实现，详见 third_party/.../README.md
  flutter_secure_storage_ohos:
    path: third_party/flutter_secure_storage_ohos
  # 账号扫码登录二维码渲染（与桌面端同款 generate_tv_login_code 流程）
  qr_flutter: ^4.1.0
  # 本地音乐扫描运行时权限
  permission_handler: ^11.3.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/splash_logo.png

# 鸿蒙（flutter_ohos）插件钉版：3.47.7 flutter 工具 pub get 不再做 OHOS
# 插件重映射，以下包会被解析回 pub.dev 原版（无 ohos 平台实现），
# 导致 GeneratedPluginRegistrant.ets 丢插件 → 启动即黑屏（readAppMode 抛
# MissingPluginException，runApp 永不执行）。显式钉回 SIG/TPC fork，
# ref 锁 commit（与历史 pubspec.lock 一致），不随分支漂移。
dependency_overrides:
  audio_service:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_audio_service.git
      path: audio_service
      ref: 89d712c150cd979692fb360fe698bd107c7eae47
  audio_session:
    git:
      url: https://gitcode.com/CPF-Flutter/flutter_audio_session.git
      path: .
      ref: bd97a32d519c94772a4693d92cca88b145c6f4f3
  just_audio:
    git:
      url: https://gitcode.com/openharmony-sig/fluttertpc_just_audio.git
      path: just_audio
      ref: e366bb5858812da73b204ac5f071b9d2cdd11ebe
  path_provider:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/path_provider/path_provider
      ref: 2f21e26e09efb92b8429c840ae7ca0cb024f036c
  permission_handler:
    git:
      url: https://gitcode.com/openharmony-sig/flutter_permission_handler.git
      path: permission_handler
      ref: 9094b9494b311dae71fe0399d9acd546a773edef
  shared_preferences:
    git:
      url: https://gitcode.com/openharmony-tpc/flutter_packages.git
      path: packages/shared_preferences/shared_preferences
      ref: 2f21e26e09efb92b8429c840ae7ca0cb024f036c
