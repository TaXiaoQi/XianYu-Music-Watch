name: xianyu_watch
description: "弦予音乐腕上版（Wear OS）：连接手机时为延伸控制器，独立时支持本地/在线播放。"
publish_to: 'none'

version: 0.1.0-beta5+10000

environment:
  # 下限放宽到 3.11：Flutter-OH 3.41.10-ohos 对应 Dart 3.11（鸿蒙构建用），
  # 官方 Flutter（Android）用 Dart 3.12+/3.13 仍满足（与移动端同款写法）
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理（与移动端同栈）
  flutter_riverpod: ^2.6.1
  # 手表表冠旋转输入
  wearable_rotary: ^2.0.4
  # 已配对手机地址持久化
  shared_preferences: ^2.3.3
  # Rust core（扫描/入库/元数据解析，与移动端同源 libxianyu_core.so）
  flutter_rust_bridge: 2.12.0
  # 本地播放
  just_audio: ^0.9.0
  # 后台播放保障：系统 MediaSession + 前台媒体服务（灭屏/切走不被杀）
  audio_service: ^0.18.18
  # 数据目录/路径
  path_provider: ^2.1.0
  path: ^1.9.0
  # 插件脚本 SHA-256 指纹（与移动端同栈）
  crypto: ^3.0.3
  # 账号扫码登录二维码渲染（与桌面端同款 generate_tv_login_code 流程）
  qr_flutter: ^4.1.0
  # 本地音乐扫描运行时权限
  permission_handler: ^11.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
